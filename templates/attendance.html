{% extends "base.html" %}{% block title %}الحضور{% endblock %}{% block heading %}الحضور والانصراف{% endblock %}{% block content %}
<div class="card"><form method="get" class="toolbar"><input name="date" type="date" value="{{day}}"><button class="btn">عرض</button></form><form method="post"><div class="table-wrap"><table class="table"><thead><tr><th>الطفل</th><th>الحالة</th><th>الدخول</th><th>الخروج</th></tr></thead><tbody>{% for c in children %}<tr><td>{{c.name}}</td><td><select name="status_{{c.id}}"><option value="present" {% if c.status=='present' %}selected{% endif %}>حاضر</option><option value="absent" {% if c.status=='absent' %}selected{% endif %}>غائب</option></select></td><td><input name="in_{{c.id}}" type="time" value="{{c.check_in or ''}}"></td><td><input name="out_{{c.id}}" type="time" value="{{c.check_out or ''}}"></td></tr>{% endfor %}</tbody></table></div><div class="save" style="margin-top:15px"><button class="btn">حفظ الحضور</button></div></form></div>{% endblock %}
